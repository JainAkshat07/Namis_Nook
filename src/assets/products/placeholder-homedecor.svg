<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Crochet home decor placeholder">
  <rect width="400" height="400" fill="#e6f0ef"/>
  <!-- doily / mandala -->
  <g transform="translate(200 190)">
    <circle r="120" fill="#ffffff"/>
    <circle r="120" fill="none" stroke="#a9c4a2" stroke-width="6" stroke-dasharray="10 8"/>
    <circle r="90" fill="none" stroke="#e08a97" stroke-width="5" stroke-dasharray="8 8"/>
    <circle r="60" fill="none" stroke="#c9a6d8" stroke-width="5"/>
    <circle r="30" fill="#f6d8d2"/>
