      <line x1="-120" y1="0" x2="-90" y2="0"/><line x1="120" y1="0" x2="90" y2="0"/>
      <line x1="-85" y1="-85" x2="-64" y2="-64"/><line x1="85" y1="-85" x2="64" y2="-64"/>
      <line x1="-85" y1="85" x2="-64" y2="64"/><line x1="85" y1="85" x2="64" y2="64"/>
    </g>
  </g>
  <text x="200" y="378" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" fill="#6b4c57">Home decor photo</text>
</svg>
